  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0b1410" flood-opacity=".28"/></filter>
</defs>
<rect width="760" height="480" rx="34" fill="url(#bg)"/>
<g opacity=".24" stroke="#dfe8e1" stroke-width="2">
  <path d="M55 80H330M55 135H330M55 190H330M55 245H330M55 300H330M55 355H330"/>
  <path d="M80 55V380M135 55V380M190 55V380M245 55V380M300 55V380"/>
