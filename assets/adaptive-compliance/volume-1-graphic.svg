</g>
<path d="M330 245 C405 245 405 122 486 122 S585 196 676 105 M330 245 C410 245 424 350 510 350 S590 300 686 374 M330 245 C422 245 460 239 548 239 S627 239 700 239" fill="none" stroke="url(#lime)" stroke-width="8" stroke-linecap="round"/>
<g fill="#d5ef47" stroke="#18231e" stroke-width="6" filter="url(#shadow)">
  <circle cx="486" cy="122" r="20"/><circle cx="676" cy="105" r="18"/><circle cx="510" cy="350" r="20"/><circle cx="686" cy="374" r="18"/><circle cx="548" cy="239" r="24"/><circle cx="700" cy="239" r="18"/>
