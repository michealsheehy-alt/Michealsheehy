      <rect x="88" y="211" width="176" height="58" rx="15" fill="#f7f3e8" filter="url(#shadow4)"/>
      <rect x="88" y="300" width="176" height="58" rx="15" fill="#f7f3e8" filter="url(#shadow4)"/>
