<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">The Message Is the Control visual</title>
  <desc id="desc">A structured payment message carries identity, purpose and context into an active control decision.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18251f"/>
      <stop offset="1" stop-color="#42614f"/>
    </linearGradient>
    <linearGradient id="flow4" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d5ef47"/>
      <stop offset="1" stop-color="#91aa2d"/>
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#101a15" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="760" height="480" rx="34" fill="url(#bg4)"/>
  <g fill="none" stroke="#f6f3e9" stroke-opacity=".16" stroke-width="2">
    <path d="M96 91H664"/>
    <path d="M96 389H664"/>
    <path d="M96 91V389"/>
    <path d="M664 91V389"/>
  </g>
