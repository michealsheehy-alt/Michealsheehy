<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Global Compliance Without the Global Bottleneck visual</title>
  <desc id="desc">One global standard connects regional expertise and local decisions in a continuous operating system.</desc>
