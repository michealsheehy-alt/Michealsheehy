<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Trust at the Speed of Money visual</title>
  <desc id="desc">A connected stablecoin lifecycle runs from reserves and issuance through wallets and payments to redemption.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17211d"/>
      <stop offset="1" stop-color="#42614f"/>
    </linearGradient>
    <linearGradient id="flow3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d5ef47"/>
      <stop offset="1" stop-color="#91aa2d"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#101a15" flood-opacity=".32"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#d5ef47"/>
    </marker>
  </defs>
  <rect width="760" height="480" rx="34" fill="url(#bg3)"/>
  <g fill="none" stroke="#f6f3e9" stroke-opacity=".14" stroke-width="2">
    <path d="M82 83H678"/>
    <path d="M82 397H678"/>
    <path d="M82 83V397"/>
    <path d="M678 83V397"/>
  </g>
  <text x="380" y="55" fill="#d5ef47" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4" text-anchor="middle">THE STABLECOIN TRUST STACK</text>

  <g fill="none" stroke="url(#flow3)" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow3)">
    <path d="M234 166H293"/>
    <path d="M467 166H526"/>
    <path d="M605 220V260"/>
    <path d="M526 314H467"/>
    <path d="M293 314H234"/>
    <path d="M155 260V220"/>
  </g>

  <g filter="url(#shadow3)">
    <rect x="86" y="111" width="148" height="110" rx="19" fill="#f7f3e8"/>
    <rect x="293" y="111" width="174" height="110" rx="19" fill="#e6efb0"/>
    <rect x="526" y="111" width="148" height="110" rx="19" fill="#f7f3e8"/>
    <rect x="526" y="259" width="148" height="110" rx="19" fill="#f7f3e8"/>
    <rect x="293" y="259" width="174" height="110" rx="19" fill="#e6efb0"/>
    <rect x="86" y="259" width="148" height="110" rx="19" fill="#f7f3e8"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#18231e" font-size="17" font-weight="800">
      <text x="160" y="160">RESERVE</text><text x="160" y="182">ASSETS</text>
      <text x="380" y="160">ISSUER</text><text x="380" y="182">&amp; TOKEN</text>
      <text x="600" y="160">WALLET</text><text x="600" y="182">NETWORK</text>
      <text x="600" y="309">PAYMENT</text><text x="600" y="331">USE</text>
      <text x="380" y="309">IDENTITY</text><text x="380" y="331">&amp; CONTROL</text>
      <text x="160" y="309">REDEMPTION</text><text x="160" y="331">AT PAR</text>
    </g>
    <g fill="#718078" font-size="11" font-weight="700" letter-spacing="1.2">
      <text x="160" y="201">VALUE</text>
      <text x="380" y="201">AUTHORITY</text>
      <text x="600" y="201">ACCESS</text>
      <text x="600" y="350">PURPOSE</text>
      <text x="380" y="350">EVIDENCE</text>
      <text x="160" y="350">TRUST</text>
    </g>
  </g>
  <text x="380" y="434" fill="#f6f3e9" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.2" text-anchor="middle">COMPLIANCE MOVES WITH THE TOKEN</text>
</svg>
