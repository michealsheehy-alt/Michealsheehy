<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">The Safest Customer Is Not the Customer You Refused to Understand visual</title>
  <desc id="desc">A risk disposition ladder distinguishes lower, manageable elevated, unmanageable and prohibited risk.</desc>
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17211d"/><stop offset="1" stop-color="#42614f"/></linearGradient>
    <marker id="arrow8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d5ef47"/></marker>
  </defs>
  <rect width="760" height="480" rx="34" fill="url(#bg8)"/>
  <text x="380" y="52" fill="#d5ef47" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2.2" text-anchor="middle">THE RESPONSIBLE RISK DISPOSITION LADDER</text>
  <g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="64" y="220" width="142" height="104" rx="18" fill="#e6efb0"/>
    <text x="135" y="260" fill="#18231e" font-size="17">LOWER</text><text x="135" y="284" fill="#18231e" font-size="17">RISK</text><text x="135" y="304" fill="#718078" font-size="10" letter-spacing="1">PROPORTIONATE</text>
    <rect x="228" y="184" width="142" height="140" rx="18" fill="#f7f3e8"/>
    <text x="299" y="226" fill="#18231e" font-size="16">MANAGEABLE</text><text x="299" y="250" fill="#18231e" font-size="16">ELEVATED</text><text x="299" y="274" fill="#18231e" font-size="16">RISK</text><text x="299" y="302" fill="#718078" font-size="10" letter-spacing="1">CONTROLLED ACCESS</text>
    <rect x="392" y="148" width="142" height="176" rx="18" fill="#dfe9cf"/>
    <text x="463" y="208" fill="#18231e" font-size="16">UNMANAGEABLE</text><text x="463" y="232" fill="#18231e" font-size="16">RISK</text><text x="463" y="274" fill="#718078" font-size="10" letter-spacing="1">RESTRICT</text><text x="463" y="293" fill="#718078" font-size="10" letter-spacing="1">OR EXIT</text>
    <rect x="556" y="112" width="142" height="212" rx="18" fill="#d5ef47"/>
    <text x="627" y="202" fill="#18231e" font-size="16">PROHIBITED</text><text x="627" y="226" fill="#18231e" font-size="16">RISK</text><text x="627" y="274" fill="#718078" font-size="10" letter-spacing="1">MANDATORY</text><text x="627" y="293" fill="#718078" font-size="10" letter-spacing="1">ACTION</text>
  </g>
  <path d="M83 360H674" fill="none" stroke="#d5ef47" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow8)"/>
  <text x="380" y="394" fill="#d5ef47" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">EVIDENCE · CONTROL INTENSITY · GOVERNANCE</text>
  <text x="380" y="450" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1" text-anchor="middle">GOOD COMPLIANCE DISTINGUISHES RISK</text>
</svg>
