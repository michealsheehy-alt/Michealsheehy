<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Your New Platform Is Not a Transformation visual</title>
  <desc id="desc">A compliance platform becomes a transformation only when data, process, decisions, ownership and outcomes work as one system.</desc>
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17211d"/><stop offset="1" stop-color="#42614f"/></linearGradient>
    <linearGradient id="bar7" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d5ef47"/><stop offset="1" stop-color="#91aa2d"/></linearGradient>
  </defs>
  <rect width="760" height="480" rx="34" fill="url(#bg7)"/>
  <text x="380" y="50" fill="#d5ef47" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2.2" text-anchor="middle">THE COMPLIANCE TRANSFORMATION STACK</text>
  <g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="130" y="88" width="500" height="58" rx="15" fill="#e6efb0"/>
    <text x="380" y="124" fill="#18231e" font-size="18">MEASURABLE RISK OUTCOMES</text>
    <rect x="162" y="157" width="436" height="54" rx="14" fill="#f7f3e8"/>
    <text x="380" y="191" fill="#18231e" font-size="17">DECISIONS</text>
    <rect x="194" y="222" width="372" height="54" rx="14" fill="#dfe9cf"/>
    <text x="380" y="256" fill="#18231e" font-size="17">PROCESS</text>
    <rect x="226" y="287" width="308" height="54" rx="14" fill="#f7f3e8"/>
    <text x="380" y="321" fill="#18231e" font-size="17">TECHNOLOGY &amp; MODELS</text>
    <rect x="258" y="352" width="244" height="54" rx="14" fill="#e6efb0"/>
    <text x="380" y="386" fill="#18231e" font-size="17">RELIABLE DATA</text>
  </g>
  <rect x="84" y="88" width="20" height="318" rx="10" fill="url(#bar7)"/>
  <rect x="656" y="88" width="20" height="318" rx="10" fill="url(#bar7)"/>
  <text x="94" y="432" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(-90 94 432)">OWNERSHIP</text>
  <text x="666" y="432" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(90 666 432)">ASSURANCE</text>
  <text x="380" y="452" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1.1" text-anchor="middle">SOFTWARE IS THE START · OPERATING CHANGE IS THE WORK</text>
</svg>
