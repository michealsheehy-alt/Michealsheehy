name: Rebuild Know Your Agent social card

on:
  push:
    paths:
      - '.github/workflows/rebuild-kya-social-card.yml'

permissions:
  contents: write

jobs:
  rebuild-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin
      - name: Build 1200x627 social card from SVG
        run: |
          mkdir -p assets/insights
          cat > /tmp/kya-social.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
            <rect width="1200" height="627" fill="#192720"/>
            <rect x="0" y="540" width="1200" height="87" fill="#f4f1ea"/>
            <circle cx="1110" cy="75" r="210" fill="#21352b"/>
            <circle cx="1010" cy="185" r="150" fill="#253a31"/>
            <text x="72" y="88" fill="#aabc9f" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">PAYMENTS · AI · IDENTITY</text>
            <text x="72" y="205" fill="#f4f1ea" font-family="Georgia,serif" font-size="92" font-weight="700">Know Your Agent</text>
            <text x="76" y="268" fill="#c5db49" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">The Next Identity Challenge in Payments</text>
            <line x1="76" y1="305" x2="690" y2="305" stroke="#718078" stroke-width="2"/>
            <text x="76" y="355" fill="#d5ddd8" font-family="Arial,Helvetica,sans-serif" font-size="27">KYC identifies the principal.</text>
            <text x="76" y="396" fill="#d5ddd8" font-family="Arial,Helvetica,sans-serif" font-size="27">Agentic commerce adds a second question:</text>
            <text x="76" y="445" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Who is exercising the customer's authority?</text>
            <text x="76" y="494" fill="#aabc9f" font-family="Arial,Helvetica,sans-serif" font-size="22">Identity · Delegated Authority · Monitoring · Revocation</text>

            <g transform="translate(850 118)">
              <line x1="0" y1="130" x2="125" y2="55" stroke="#aabc9f" stroke-width="4"/>
              <line x1="125" y1="55" x2="225" y2="145" stroke="#aabc9f" stroke-width="4"/>
              <line x1="0" y1="130" x2="115" y2="240" stroke="#aabc9f" stroke-width="4"/>
              <line x1="115" y1="240" x2="225" y2="145" stroke="#aabc9f" stroke-width="4"/>
              <circle cx="0" cy="130" r="58" fill="#f4f1ea" stroke="#c5db49" stroke-width="5"/>
              <circle cx="125" cy="55" r="50" fill="#c5db49"/>
              <circle cx="225" cy="145" r="58" fill="#f4f1ea" stroke="#c5db49" stroke-width="5"/>
              <circle cx="115" cy="240" r="50" fill="#253a31" stroke="#aabc9f" stroke-width="4"/>
              <text x="0" y="140" text-anchor="middle" fill="#192720" font-family="Arial" font-size="24" font-weight="700">KYC</text>
              <text x="125" y="63" text-anchor="middle" fill="#192720" font-family="Arial" font-size="20" font-weight="700">AGENT</text>
              <text x="225" y="154" text-anchor="middle" fill="#192720" font-family="Arial" font-size="20" font-weight="700">PAY</text>
              <text x="115" y="249" text-anchor="middle" fill="#f4f1ea" font-family="Arial" font-size="18" font-weight="700">LIMITS</text>
            </g>

            <text x="72" y="592" fill="#192720" font-family="Georgia,serif" font-size="29" font-weight="700">Micheal Sheehy</text>
            <text x="1040" y="592" text-anchor="end" fill="#66716b" font-family="Arial,Helvetica,sans-serif" font-size="20">michealsheehy.com</text>
          </svg>
          SVG
          rsvg-convert -w 1200 -h 627 /tmp/kya-social.svg -o /tmp/kya-social.png
          convert /tmp/kya-social.png -quality 92 assets/insights/know-your-agent-social.jpg
          identify assets/insights/know-your-agent-social.jpg
      - name: Update article metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('articles/know-your-agent.html')
          s=p.read_text()
          import re
          s=re.sub(r'<meta property="og:image" content="[^"]+"/>','<meta property="og:image" content="https://www.michealsheehy.com/assets/insights/know-your-agent-social.jpg"/>',s)
          s=re.sub(r'<meta property="og:image:type" content="[^"]+"/>','<meta property="og:image:type" content="image/jpeg"/>',s)
          s=re.sub(r'<meta name="twitter:image" content="[^"]+"/>','<meta name="twitter:image" content="https://www.michealsheehy.com/assets/insights/know-your-agent-social.jpg"/>',s)
          if 'og:image:width' not in s:
              s=s.replace('<meta property="og:image:alt" content="Know Your Agent: The Next Identity Challenge in Payments"/>','<meta property="og:image:alt" content="Know Your Agent: The Next Identity Challenge in Payments"/>\n<meta property="og:image:type" content="image/jpeg"/>\n<meta property="og:image:width" content="1200"/>\n<meta property="og:image:height" content="627"/>')
          p.write_text(s)
          PY
      - name: Commit rebuilt social card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insights/know-your-agent-social.jpg articles/know-your-agent.html
          git diff --cached --quiet || git commit -m "Rebuild Know Your Agent social preview card"
          git push
