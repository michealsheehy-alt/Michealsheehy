name: Fix Know Your Agent social preview JPEG

on:
  push:
    paths:
      - '.github/workflows/fix-kya-social-jpeg.yml'

permissions:
  contents: write

jobs:
  fix-social-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert social preview to JPEG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert assets/insights/know-your-agent-social-v2.png -background white -alpha remove -alpha off -quality 90 assets/insights/know-your-agent-social.jpg
          identify assets/insights/know-your-agent-social.jpg
      - name: Update Open Graph metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('articles/know-your-agent.html')
          s=p.read_text()
          s=s.replace('https://www.michealsheehy.com/assets/insights/know-your-agent-social-v2.png','https://www.michealsheehy.com/assets/insights/know-your-agent-social.jpg')
          s=s.replace('<meta property="og:image:type" content="image/png"/>','<meta property="og:image:type" content="image/jpeg"/>')
          p.write_text(s)
          PY
      - name: Commit JPEG social preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insights/know-your-agent-social.jpg articles/know-your-agent.html
          git diff --cached --quiet || git commit -m "Use JPEG social preview for Know Your Agent"
          git push
