name: Fix TSA image asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tsa-image.yml'
      - 'assets/insights/tsa-virgo-og.jpg.b64'

permissions:
  contents: write

jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG
        run: |
          base64 -d assets/insights/tsa-virgo-og.jpg.b64 > assets/insights/tsa-virgo-og.jpg
          file assets/insights/tsa-virgo-og.jpg
      - name: Commit corrected image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insights/tsa-virgo-og.jpg
          if git diff --cached --quiet; then
            echo "No image change needed"
            exit 0
          fi
          git commit -m "Fix TSA LinkedIn preview image binary"
          git push
