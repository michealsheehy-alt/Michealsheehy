name: Publish Shopping Cart Test

on:
  push:
    paths:
      - '.publish-shopping-cart/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build image and article
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/insights articles
          cat .publish-shopping-cart/image.part* | base64 --decode > assets/insights/shopping-cart-test.webp
          python - <<'PY'
          from pathlib import Path
          import html, json, re

          published = '2026-09-12'
          article_url = 'https://www.michealsheehy.com/articles/shopping-cart-test.html'
          image_url = 'https://www.michealsheehy.com/assets/insights/shopping-cart-test.webp'
          md = Path('.publish-shopping-cart/article.md').read_text(encoding='utf-8').strip()
          blocks = re.split(r'\n\s*\n', md)
          title = blocks[0].removeprefix('# ').strip()

          def inline(text):
              out = html.escape(text, quote=False)
              out = re.sub(r'\*([^*]+)\*', r'<em>\1</em>', out)
              out = out.replace('people who don’t return their TSA trays', '<a href="tsa-tray-test.html">people who don’t return their TSA trays</a>')
              return out

          body = []
          for block in blocks[1:]:
              block = block.strip()
              if not block:
                  continue
              if block.startswith('## '):
                  body.append(f'<h2>{inline(block[3:].strip())}</h2>')
              else:
                  body.append(f'<p>{inline(" ".join(block.splitlines()))}</p>')
          body_html = '\n'.join(body)

          description = 'Micheal Sheehy turns abandoned shopping carts, Trader Joe’s parking-lot chaos and self-appointed cart governance into a lesson about ownership, culture and sustainable leadership.'
          lead = 'An even less scientific theory of leadership, ownership, invisible work and why Trader Joe’s parking lots are the gateway to hell.'
          article = f'''<!DOCTYPE html><html lang="en"><head>
          <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <meta name="description" content="{html.escape(description, quote=True)}"/>
          <title>{html.escape(title)} | Micheal Sheehy</title>
          <link rel="canonical" href="{article_url}"/>
          <meta property="og:type" content="article"/><meta property="og:site_name" content="Micheal Sheehy"/>
          <meta property="og:title" content="{html.escape(title, quote=True)}"/>
          <meta property="og:description" content="{html.escape(lead, quote=True)}"/>
          <meta property="og:url" content="{article_url}"/>
          <meta property="og:image" content="{image_url}"/>
          <meta property="og:image:alt" content="Micheal Sheehy humorously policing abandoned shopping carts in a Trader Joe’s parking lot"/>
          <meta property="article:published_time" content="{published}"/><meta property="article:modified_time" content="{published}"/><meta property="article:section" content="Leadership &amp; Identity"/>
          <meta name="twitter:card" content="summary_large_image"/><meta name="twitter:title" content="The Shopping Cart Test"/><meta name="twitter:description" content="An even less scientific theory of leadership, ownership and cart governance."/><meta name="twitter:image" content="{image_url}"/>
          <link rel="icon" href="../favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="../styles.css"/>
          <style>.article-hero{{padding:82px 0 54px;border-bottom:1px solid var(--line)}}.article-hero h1{{max-width:1050px;margin:15px 0 22px}}.article-meta{{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}}.article-meta span{{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:.76rem;font-weight:750}}.article-aside nav a{{text-decoration:none}}.article-aside nav a:hover{{text-decoration:underline}}.prose blockquote{{margin:32px 0;padding:22px 25px;border-left:4px solid var(--accent);background:var(--soft);font-family:Georgia,"Times New Roman",serif;font-size:1.35rem}}.article-photo{{margin:0 0 40px}}.article-photo img{{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);box-shadow:0 12px 28px rgba(7,24,39,.08)}}.article-photo figcaption{{margin-top:10px;color:var(--muted);font-size:.82rem;line-height:1.45}}.article-end{{margin-top:52px;padding-top:30px;border-top:1px solid var(--line)}}</style>
          <script type="application/ld+json">{json.dumps({"@context":"https://schema.org","@type":"Article","@id":article_url+"#article","headline":title,"description":description,"image":image_url,"datePublished":published,"dateModified":published,"articleSection":"Leadership & Identity","author":{"@type":"Person","@id":"https://www.michealsheehy.com/about.html#person","name":"Micheal Sheehy","url":"https://www.michealsheehy.com/about.html"},"publisher":{"@type":"Person","@id":"https://www.michealsheehy.com/about.html#person","name":"Micheal Sheehy","url":"https://www.michealsheehy.com/about.html"},"isPartOf":{"@id":"https://www.michealsheehy.com/#website"},"mainEntityOfPage":{"@type":"WebPage","@id":article_url}}, ensure_ascii=False, separators=(',',':'))}</script>
          </head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Micheal Sheehy</a><button aria-label="Open navigation" class="mobile-toggle" type="button">☰</button><nav aria-label="Primary navigation" class="nav-links"><a href="../index.html" data-home-link="true">Home</a><a href="../about.html">About</a><a aria-current="page" href="../insights.html">Insights</a><a href="../adaptive-compliance.html">Adaptive Compliance</a><a href="../speaking.html">Speaking</a><a href="../media.html">Media</a><a href="../contact.html">Connect</a></nav></div></header><main>
          <section class="article-hero"><div class="container"><div class="eyebrow">Leadership &amp; Identity · Cart Governance</div><h1>{html.escape(title)}</h1><p class="lead">{html.escape(lead)}</p><div class="article-meta"><span>By Micheal Sheehy</span><span>10 min read</span><span>September 2026</span></div></div></section>
          <section class="section"><div class="container article-layout"><aside class="article-aside"><p><a href="../insights.html">← All insights</a></p></aside><article class="prose">
          <figure class="article-photo"><img src="../assets/insights/shopping-cart-test.webp" alt="Micheal Sheehy humorously policing abandoned shopping carts in a Trader Joe’s parking lot" width="1536" height="1024" loading="eager" fetchpriority="high" decoding="async"/><figcaption>Cart governance has entered its enforcement phase.</figcaption></figure>
          {body_html}
          <div class="article-end"><p><a href="../insights.html">← Back to all insights</a></p></div>
          </article></div></section></main>
          <footer class="footer"><div class="container footer-inner"><span>© 2026 Micheal Sheehy</span><nav class="footer-links" aria-label="Secondary navigation"><a href="../start-here.html">Start here</a><a href="../case-studies.html">Case studies</a><a href="../tools.html">Tools</a><a href="../now.html">Now</a></nav></div></footer><script src="../script.js"></script></body></html>'''
          Path('articles/shopping-cart-test.html').write_text(article, encoding='utf-8')

          insights_path = Path('insights.html')
          insights = insights_path.read_text(encoding='utf-8')
          if 'articles/shopping-cart-test.html' not in insights:
              card = '<article class="card article-card filterable-card" data-category="leadership"><span class="meta">Leadership &amp; Identity · 10 min</span><h3>The Shopping Cart Test</h3><p>An even less scientific theory of ownership, culture, permanent cleanup and why Trader Joe’s parking lots are the gateway to hell.</p><a class="read" href="articles/shopping-cart-test.html">Read the full article →</a></article>\n'
              marker = '<div class="grid-3" id="insight-cards">\n'
              insights = insights.replace(marker, marker + card, 1)
              insights_path.write_text(insights, encoding='utf-8')

          topic_path = Path('topics/leadership-identity.html')
          topic = topic_path.read_text(encoding='utf-8')
          if '../articles/shopping-cart-test.html' not in topic:
              card = '<article class="card topic-card"><h2>The Shopping Cart Test</h2><p>An even less scientific theory of ownership, culture and the tiny choices people make when nobody is watching.</p><a class="read" href="../articles/shopping-cart-test.html">Read the leadership essay →</a></article>\n'
              topic = topic.replace('<div class="grid-3"><article class="card topic-card">', '<div class="grid-3">' + card + '<article class="card topic-card">', 1)
              pattern = re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)', re.S)
              def update_jsonld(match):
                  try:
                      data = json.loads(match.group(2))
                  except Exception:
                      return match.group(0)
                  if data.get('@type') != 'CollectionPage':
                      return match.group(0)
                  items = data.get('mainEntity', {}).get('itemListElement', [])
                  new = {"@type":"ListItem","position":1,"item":{"@type":"CreativeWork","name":"The Shopping Cart Test: An Even Less Scientific Theory of Leadership","description":"An even less scientific theory of ownership, culture and sustainable leadership.","url":article_url}}
                  items = [x for x in items if x.get('item', {}).get('url') != article_url]
                  items.insert(0, new)
                  for i, item in enumerate(items, 1): item['position'] = i
                  data['mainEntity']['itemListElement'] = items
                  return match.group(1) + json.dumps(data, ensure_ascii=False, separators=(',',':')) + match.group(3)
              topic = pattern.sub(update_jsonld, topic, count=1)
              topic_path.write_text(topic, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          sitemap = re.sub(r'(<loc>https://www\.michealsheehy\.com/insights\.html</loc><lastmod>)[^<]+', r'\g<1>'+published, sitemap)
          sitemap = re.sub(r'(<loc>https://www\.michealsheehy\.com/topics/leadership-identity\.html</loc><lastmod>)[^<]+', r'\g<1>'+published, sitemap)
          if article_url not in sitemap:
              sitemap = sitemap.replace('</urlset>', f'  <url><loc>{article_url}</loc><lastmod>{published}</lastmod></url>\n</urlset>')
          sitemap_path.write_text(sitemap, encoding='utf-8')
          PY
      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publish-shopping-cart
          rm -f .github/workflows/publish-shopping-cart.yml
          git config user.name "michealsheehy-alt"
          git config user.email "michealsheehy@gmail.com"
          git add -A
          git commit -m "Publish Shopping Cart Test article"
          git push
